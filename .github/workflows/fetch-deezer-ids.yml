name: Fetch Deezer Track IDs

# Run manually from the GitHub Actions tab, or on a schedule (weekly Sunday).
# GitHub runners have US IPs so Deezer search is available there even when
# it is geo-blocked in India.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # every Sunday at 03:00 UTC

jobs:
  fetch-ids:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch Deezer IDs
        run: npx tsx scripts/fetch-deezer-ids.mts

      - name: Apply patch to catalog
        run: npx tsx scripts/apply-deezer-patch.mts

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/lib/catalog.ts && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(catalog): update Deezer track IDs"
          branch: "auto/deezer-ids"
          title: "feat(catalog): update Deezer track IDs"
          body: |
            Auto-generated by the **Fetch Deezer Track IDs** workflow.

            Updates `src/lib/catalog.ts` with the latest Deezer track IDs fetched
            from a GitHub runner (US IP) where the Deezer search endpoint is available.

            These IDs enable `resolver.ts` to use Deezer's `/track/{id}` endpoint
            directly, bypassing the search rate-limit that affects Cloudflare Worker IPs.
          labels: "automated,audio"
          delete-branch: true
