name: Fetch Deezer Track IDs

# Run manually from the GitHub Actions tab, or on a schedule (weekly Sunday).
# GitHub runners have US IPs so Deezer search is available there even when
# it is geo-blocked in India.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # every Sunday at 03:00 UTC

jobs:
  fetch-ids:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch Deezer IDs
        run: npx tsx scripts/fetch-deezer-ids.mts

      - name: Apply patch to catalog
        run: npx tsx scripts/apply-deezer-patch.mts

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/lib/catalog.ts && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog.ts
          git commit -m "feat(catalog): update Deezer track IDs [skip ci]"
          git push origin HEAD:master
